server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://userservice
          predicates:
            - Path=/api/users/**
        - id: activity-service
          uri: lb://activityService
          predicates:
            - Path=/api/activities/**
        - id: ai-service
          uri: lb://AIservice
          predicates:
            - Path=/recommendations/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/